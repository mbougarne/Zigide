name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Repository checks (Zig)
    # macOS arm64 is the first-release target platform (docs/architecture/01-vision-and-scope.md).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - # Resolves the Zig version from minimum_zig_version in build.zig.zon,
        # which is the pinned toolchain per the Milestone 0 policy.
        uses: mlugg/setup-zig@v2
      - name: Hygiene, links, trace ledger, zig fmt
        run: zig build check
      - name: Install pinned ZLS
        run: |
          curl --fail --location --retry 3 https://github.com/zigtools/zls/releases/download/0.16.0/zls-aarch64-macos.tar.xz -o "$RUNNER_TEMP/zls.tar.xz"
          echo "b93ec549f8558a7e85984a840e9276d274f1059b54ade4254296ef4982958359  $RUNNER_TEMP/zls.tar.xz" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/zigide-zls"
          tar -xJf "$RUNNER_TEMP/zls.tar.xz" -C "$RUNNER_TEMP/zigide-zls"
      - name: Initialize and cleanly stop real ZLS
        run: zig build zls-spike -Dzls="$RUNNER_TEMP/zigide-zls/zls" --summary all
      - name: Validate agents/history.json against its schema
        run: npx -y ajv-cli@5.0.0 validate --spec=draft2020 -s agents/history.schema.json -d agents/history.json
      - name: ReleaseSafe text correctness and seeded equivalence
        run: zig build text-test -Doptimize=ReleaseSafe -j2 --summary all
      - name: Retain ReleaseFast measurements (budgets require recorded target hardware)
        run: zig build text-benchmark -Doptimize=ReleaseFast -j2 --summary all -- .zig-cache/text-benchmark-ci.csv
      - name: Retain production text measurements (target budgets require recorded hardware)
        run: |
          zig build production-text-benchmark -Doptimize=ReleaseFast -j2 --summary all -- .zig-cache/production-text-ci.csv
          zig build production-text-summary -Doptimize=ReleaseFast -j2 -- .zig-cache/production-text-ci.csv .zig-cache/production-text-summary-ci.csv
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: zigide-text-model-${{ github.sha }}
          path: |
            .zig-cache/text-benchmark-ci.csv
            .zig-cache/production-text-ci.csv
            .zig-cache/production-text-summary-ci.csv
      - name: Shared scenario and system candidate build
        run: zig build ui-test ui-spike -Doptimize=ReleaseSafe -j2 --summary all
      - name: Bundle and package regression tests
        run: PYTHONPYCACHEPREFIX=.zig-cache/python python3 tests/ui_spike_test.py
      - name: Native candidate system dependencies
        run: brew install sdl3 pkg-config
      - name: Pinned DVUI and AccessKit candidate build
        run: python3 tools/prepare_ui_native.py
      - name: Bundle all candidates
        run: |
          python3 tools/ui_spike.py bundle appkit
          python3 tools/ui_spike.py bundle webview
          python3 tools/ui_spike.py bundle dvui
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: zigide-ui-candidates-${{ github.sha }}
          path: zig-out/ui-spike/*.zip
