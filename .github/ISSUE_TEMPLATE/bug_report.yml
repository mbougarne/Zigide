name: Bug report
description: Something in Zigide or its tooling does not behave as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Ran `zig build check`
        2. Expected ...
        3. Got ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and version, chip, and the output of `zig version`.
      placeholder: |
        macOS 15.x, Apple M3 Pro
        zig 0.16.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant output. Redact anything private before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
